<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" 
    />
    <title>StrixOS</title>

    <!-- EMERGENCY CACHE & SERVICE WORKER PURGE HOOK -->
    <script>
      (function() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('reset') || urlParams.has('reinstall') || urlParams.has('purge')) {
          console.warn('Executing emergency cache & storage purge...');
          
          // 1. Unregister all active Service Workers
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
          }

          // 2. Delete all CacheStorage keys
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) {
                caches.delete(names[i]);
              }
            });
          }

          // 3. Clear LocalStorage and SessionStorage
          try {
            localStorage.clear();
            sessionStorage.clear();
          } catch(e) {}

          // 4. Delete IndexedDB databases
          if (window.indexedDB && indexedDB.databases) {
            indexedDB.databases().then(function(dbs) {
              for (var i = 0; i < dbs.length; i++) {
                if (dbs[i].name) indexedDB.deleteDatabase(dbs[i].name);
              }
            });
          }

          // 5. Expire document cookies
          var cookies = document.cookie.split(";");
          for (var i = 0; i < cookies.length; i++) {
            var cookie = cookies[i];
            var eqPos = cookie.indexOf("=");
            var name = eqPos > -1 ? cookie.substr(0, eqPos).trim() : cookie.trim();
            document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
          }

          // 6. Clean reload without query parameter
          setTimeout(function() {
            window.location.replace(window.location.origin + window.location.pathname);
          }, 350);
        }
      })();
    </script>

    <!-- PWA Web App Manifest & App Icons -->
    <link rel="manifest" href="/manifest.json?v=5" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" href="/logo192.png?v=3" />
    <link rel="apple-touch-icon" href="/logo192.png?v=3" />

    <!-- iOS / Safari Standalone Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="StrixOS" />

    <!-- Android / Chrome Standalone Configuration -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Instant Bootloader Inline Styles -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior-y: none;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      .boot-logo-container {
        width: 120px;
        height: 120px;
        background: #ffffff;
        border-radius: 28px;
        box-shadow: 0 12px 30px -8px rgba(15, 23, 42, 0.12), 0 0 0 1px rgba(15, 23, 42, 0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .boot-logo {
        width: 78px;
        height: 78px;
        object-fit: contain;
        border-radius: 50%;
      }

      .boot-title {
        margin-top: 24px;
        font-size: 14px;
        font-weight: 900;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #0f172a;
      }

      .boot-subtitle {
        margin-top: 4px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #10b981;
      }

      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.97);
          opacity: 0.88;
        }
      }
    </style>
  </head>
  <body class="select-none overscroll-none">
    <div id="root">
      <!-- Instant Pre-React Boot Screen -->
      <div id="boot-splash">
        <div class="boot-logo-container">
          <img src="/logo192.png?v=3" alt="StrixOS Logo" class="boot-logo" />
        </div>
        <div class="boot-title">StrixOS</div>
        <div class="boot-subtitle">Avian Management</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
